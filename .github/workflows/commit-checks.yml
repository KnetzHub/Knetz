name: Commit & PR Checks

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  quick-checks:
    name: Quick Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Check formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "❌ Code is not formatted. Please run: gofmt -s -w ."
          gofmt -s -l .
          exit 1
        fi
        echo "✅ Code formatting is correct"

    - name: Check go.mod and go.sum
      run: |
        go mod tidy
        if ! git diff --exit-code go.mod go.sum; then
          echo "❌ go.mod or go.sum is not tidy. Please run: go mod tidy"
          exit 1
        fi
        echo "✅ go.mod and go.sum are tidy"

    - name: Quick build
      run: go build ./...

    - name: Quick tests
      run: go test -short ./...

  commit-message:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate commit messages
      run: |
        echo "Validating commit messages..."
        git log --format=%s origin/main..HEAD | while read -r msg; do
          # Allow both "feat: message" and "feat(scope): message" formats
          if ! echo "$msg" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?: .+'; then
            echo "❌ Invalid commit message format: $msg"
            echo ""
            echo "Expected formats:"
            echo "  - type: subject"
            echo "  - type(scope): subject"
            echo ""
            echo "Examples:"
            echo "  - feat: add new feature"
            echo "  - feat(cluster): add AWS EKS support"
            echo "  - fix: resolve bug in scanner"
            echo "  - fix(deps): update dependency version"
            exit 1
          fi
        done
        echo "✅ All commit messages are valid"
  

