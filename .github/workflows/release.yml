name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - major
          - minor
          - patch

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Install dependencies
      run: |
        go install github.com/git-chglog/git-chglog/cmd/git-chglog@latest
        go install github.com/caarlos0/svu@latest

    - name: Determine version bump
      id: version
      run: |
        # Get current version
        CURRENT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        echo "Current version: $CURRENT_VERSION"
        
        # Get latest commit messages since last tag
        COMMITS=$(git log ${CURRENT_VERSION}..HEAD --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")
        
        # Determine bump type based on conventional commits
        BUMP_TYPE="${{ github.event.inputs.bump_type }}"
        
        if [ "$BUMP_TYPE" = "auto" ]; then
          if echo "$COMMITS" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!:"; then
            BUMP_TYPE="major"
          elif echo "$COMMITS" | grep -qE "^feat(\([^)]+\))?:"; then
            BUMP_TYPE="minor"
          elif echo "$COMMITS" | grep -qE "^(fix|perf|refactor|style|docs|build|ci|test|chore)(\([^)]+\))?:"; then
            BUMP_TYPE="patch"
          else
            # Default to patch if no conventional commits found
            BUMP_TYPE="patch"
          fi
        fi
        
        echo "Bump type: $BUMP_TYPE"
        
        # Calculate next version using svu
        case $BUMP_TYPE in
          major)
            NEXT_VERSION=$(svu major)
            ;;
          minor)
            NEXT_VERSION=$(svu minor)
            ;;
          patch)
            NEXT_VERSION=$(svu patch)
            ;;
        esac
        
        echo "Next version: $NEXT_VERSION"
        echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        echo "next=$NEXT_VERSION" >> $GITHUB_OUTPUT
        echo "bump=$BUMP_TYPE" >> $GITHUB_OUTPUT

    - name: Check if version bump needed
      id: check
      run: |
        CURRENT="${{ steps.version.outputs.current }}"
        NEXT="${{ steps.version.outputs.next }}"
        
        if [ "$CURRENT" = "$NEXT" ]; then
          echo "No version bump needed"
          echo "needed=false" >> $GITHUB_OUTPUT
        else
          echo "Version bump needed: $CURRENT -> $NEXT"
          echo "needed=true" >> $GITHUB_OUTPUT
        fi

    - name: Generate Changelog
      if: steps.check.outputs.needed == 'true'
      run: |
        # Generate changelog for this version
        git-chglog --next-tag ${{ steps.version.outputs.next }} -o CHANGELOG.md
        
        # Generate release notes for this specific version
        git-chglog --next-tag ${{ steps.version.outputs.next }} ${{ steps.version.outputs.next }} > RELEASE_NOTES.md

    - name: Update version in code
      if: steps.check.outputs.needed == 'true'
      run: |
        VERSION="${{ steps.version.outputs.next }}"
        # Remove 'v' prefix for version file
        VERSION_NO_V="${VERSION#v}"
        
        # Create VERSION file
        echo "$VERSION_NO_V" > VERSION
        
        # Update version in README if present
        if [ -f README.md ]; then
          sed -i "s/Version: .*/Version: $VERSION/g" README.md || true
        fi

    - name: Commit and tag
      if: steps.check.outputs.needed == 'true'
      run: |
        VERSION="${{ steps.version.outputs.next }}"
        
        git add CHANGELOG.md VERSION RELEASE_NOTES.md README.md 2>/dev/null || true
        git commit -m "chore(release): $VERSION [skip ci]

        - Automated version bump from ${{ steps.version.outputs.current }} to $VERSION
        - Updated CHANGELOG.md
        - Bump type: ${{ steps.version.outputs.bump }}" || true
        
        # Create annotated tag
        git tag -a "$VERSION" -m "Release $VERSION"
        
        # Push changes and tag
        git push origin main
        git push origin "$VERSION"

    - name: Run GoReleaser
      if: steps.check.outputs.needed == 'true'
      uses: goreleaser/goreleaser-action@v6
      with:
        version: latest
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Summary
      if: steps.check.outputs.needed == 'true'
      run: |
        echo "## Release Complete! 🚀" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Previous Version:** ${{ steps.version.outputs.current }}" >> $GITHUB_STEP_SUMMARY
        echo "- **New Version:** ${{ steps.version.outputs.next }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Bump Type:** ${{ steps.version.outputs.bump }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Release Notes" >> $GITHUB_STEP_SUMMARY
        cat RELEASE_NOTES.md >> $GITHUB_STEP_SUMMARY

    - name: No bump needed
      if: steps.check.outputs.needed == 'false'
      run: |
        echo "## No Version Bump Needed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Current version ${{ steps.version.outputs.current }} is up to date." >> $GITHUB_STEP_SUMMARY
